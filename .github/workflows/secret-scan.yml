name: secret-scan

# Automatically scans every push to main and every pull request for hardcoded
# secrets committed anywhere in git history. If a real credential is found the
# check fails, so a leaked key is caught before it can be merged/deployed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Scan the whole history, not just the latest commit.
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --redact \
              --verbose \
              --exit-code 1
