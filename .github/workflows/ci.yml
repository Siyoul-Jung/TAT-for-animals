name: ci

# Runs on every PR and every push to main. Unit tests and the production build
# are REQUIRED (a red here should block merge). Lint is reported but NON-blocking
# for now — the repo has pre-existing lint debt, and failing CI on it would block
# unrelated PRs. Flip lint to blocking once that debt is cleared.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Lint (non-blocking — pre-existing debt)
        run: npm run lint
        continue-on-error: true
