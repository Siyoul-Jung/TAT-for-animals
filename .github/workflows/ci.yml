name: ci

# Runs on every PR and every push to main. Unit tests, the production build, and
# lint are all REQUIRED — a red here should block merge. The lint debt has been
# cleared (0 errors; remaining items are intentional warnings), so lint now fails
# CI on any newly introduced error.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint
